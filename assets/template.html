<script>tailwind.config={theme:{extend:{colors:{slate:{100:"#f4f4f5",200:"#e4e4e7",300:"#d4d4d8",400:"#a1a1aa",500:"#71717a",600:"#303036",700:"#232328",800:"#141417",900:"#0c0c0e",950:"#09090b"}}}}}</script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--c:__ACCENT__;--rgb:__RGB__;--bg:rgba(var(--rgb),.08);--line:#232328;--ease:cubic-bezier(.2,.8,.2,1);--t:160ms}
*{-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
body{background:#09090b radial-gradient(60% 380px at 50% -80px,rgba(var(--rgb),.14),transparent) no-repeat;color:#e4e4e7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.65;letter-spacing:-.011em}
.mono,code,pre{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:0}
.accent{color:var(--c)}
.eyebrow{font-size:.6875rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c);line-height:1.2}
.lbl{font-size:.75rem;font-weight:500;letter-spacing:.02em;color:#a1a1aa;margin-bottom:.5rem}
.sh{display:flex;align-items:center;gap:.625rem;font-size:.9375rem;font-weight:600;color:#fafafa;letter-spacing:-.01em;margin-bottom:.875rem}
.sh i{width:1.75rem;height:1.75rem;padding:.4rem;border-radius:.5rem;background:var(--bg);border:1px solid rgba(var(--rgb),.22);color:var(--c)}
.logo{width:1.875rem;height:1.875rem;border-radius:.5rem;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid rgba(var(--rgb),.3);color:var(--c)}
.badge{background:var(--bg);color:var(--c);border:1px solid rgba(var(--rgb),.25)}
.line{background:linear-gradient(to bottom,rgba(var(--rgb),.55),rgba(var(--rgb),.04))}
.node{border:1.5px solid rgba(var(--rgb),.45);background:#09090b;color:var(--c);transition:all var(--t) var(--ease)}
.row:hover .node{border-color:var(--c);box-shadow:0 0 0 4px rgba(var(--rgb),.12),0 0 18px rgba(var(--rgb),.35)}
.done .node{background:var(--c);color:#09090b;border-color:var(--c)}
.card{background:linear-gradient(180deg,#131316,#0f0f12);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.4);transition:border-color var(--t) var(--ease),box-shadow 200ms var(--ease),transform var(--t) var(--ease);cursor:pointer;text-align:left;width:100%}
.card:hover{transform:translateY(-1px);border-color:rgba(var(--rgb),.5);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 0 0 1px rgba(var(--rgb),.12),0 12px 32px -14px rgba(var(--rgb),.4)}
button,input,textarea{transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),filter var(--t) var(--ease),opacity var(--t) var(--ease)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.drawer{transform:translateX(100%);transition:transform 260ms var(--ease);background:#0c0c0f;border-left:1px solid var(--line)}
.open .drawer{transform:none}
.ov{opacity:0;pointer-events:none;transition:opacity 200ms ease-out;backdrop-filter:blur(4px)}
.open .ov{opacity:1;pointer-events:auto}
.code{background:#060608;border:1px solid var(--line);border-radius:.625rem;padding:1rem 1.125rem;overflow-x:auto;font-size:.8125rem;line-height:1.7;color:#e4e4e7;white-space:pre}
textarea.code:focus{border-color:rgba(var(--rgb),.5)}
.kw{color:var(--c);font-weight:600}.st{color:#e6c07b}.nm{color:#7dd3fc}.cm{color:#71717a;font-style:italic}
table.res{border-collapse:collapse;width:100%;font-size:.8125rem}
table.res th{background:rgba(var(--rgb),.06);color:var(--c);text-align:left;padding:.625rem .875rem;border-bottom:1px solid var(--line);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap}
table.res td{padding:.5rem .875rem;border-bottom:1px solid #1b1b20;color:#e4e4e7}
table.res tr:last-child td{border-bottom:0}.null{color:#71717a;font-style:italic}
.chip{background:#141417;border:1px solid var(--line);color:#d4d4d8;font-size:.75rem;padding:.25rem .625rem;border-radius:999px;line-height:1.4}
.scn{background:var(--bg);border:1px solid rgba(var(--rgb),.2);border-radius:.75rem;padding:1rem 1.125rem}
.frag{list-style:none;margin:0;padding:0;display:grid;gap:.625rem}
.frag li{position:relative;padding-left:1.125rem;color:#d4d4d8;line-height:1.65}
.frag li:before{content:"";position:absolute;left:.125rem;top:.7em;width:.3125rem;height:.3125rem;border-radius:50%;background:var(--c)}
.frag b,.scn b{color:#fafafa;font-weight:600}
.frag code,.scn code,.sh+p code{background:#18181b;border:1px solid var(--line);padding:.0625rem .375rem;border-radius:.375rem;font-size:.85em;color:var(--c)}
input[type=checkbox]{accent-color:var(--c)}.bg-acc{background:var(--c)}.ms-item:hover{border-color:var(--c)}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#3f3f46}
.fade{animation:f 260ms var(--ease) both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.milestone-card{position:relative;overflow:hidden;padding:clamp(1.25rem,3vw,2rem);border:1px solid rgba(var(--rgb),.24);border-radius:1.25rem;background:radial-gradient(ellipse at 100% 0,rgba(var(--rgb),.14),transparent 42%),linear-gradient(145deg,#14191a,#0d0e10 68%);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 55px -35px rgba(var(--rgb),.3)}
.milestone-card:before{content:"";position:absolute;inset:0 15% auto;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.8),transparent)}
.milestone-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.milestone-title{display:flex;align-items:flex-start;gap:1rem}
.milestone-icon{width:3rem;height:3rem;flex:none;display:grid;place-items:center;border:1px solid rgba(var(--rgb),.3);border-radius:.875rem;background:rgba(var(--rgb),.1);color:var(--c)}
.milestone-title h2{margin:.35rem 0 .25rem;color:#fafafa;font-size:1.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.milestone-title p{margin:0;color:#a1a1aa;font-size:.875rem}
.milestone-count{flex:none;padding:.35rem .7rem;border:1px solid rgba(var(--rgb),.25);border-radius:999px;background:rgba(var(--rgb),.08);color:var(--c);font-size:.75rem;font-weight:600;white-space:nowrap}
.milestone-progress{height:.375rem;margin:1.25rem 0 1rem;overflow:hidden;border-radius:999px;background:#232328}
.milestone-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,rgba(var(--rgb),.7),var(--c));transition:width 240ms var(--ease)}
.milestone-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:.625rem}
.milestone-item{min-height:3.75rem;display:flex;align-items:center;gap:.75rem;padding:.75rem .875rem;border:1px solid #303036;border-radius:.75rem;background:rgba(9,9,11,.48);cursor:pointer;transition:border-color var(--t) var(--ease),background var(--t) var(--ease),transform var(--t) var(--ease)}
.milestone-item:hover{transform:translateY(-1px);border-color:rgba(var(--rgb),.45);background:rgba(var(--rgb),.05)}
.milestone-item input{width:1rem;height:1rem;flex:none;accent-color:var(--c)}
.milestone-number{width:1.75rem;height:1.75rem;flex:none;display:grid;place-items:center;border:1px solid #3f3f46;border-radius:.5rem;color:#a1a1aa;font-family:ui-monospace,monospace;font-size:.6875rem}
.milestone-text{flex:1;color:#e4e4e7;font-size:.8125rem;line-height:1.45}
.milestone-check{width:1rem;height:1rem;flex:none;color:var(--c);opacity:0;transform:scale(.8);transition:opacity var(--t) var(--ease),transform var(--t) var(--ease)}
.milestone-item.is-done{border-color:rgba(var(--rgb),.3);background:rgba(var(--rgb),.07)}
.milestone-item.is-done .milestone-number{border-color:rgba(var(--rgb),.35);color:var(--c)}
.milestone-item.is-done .milestone-text{color:#a1a1aa;text-decoration:line-through;text-decoration-color:rgba(var(--rgb),.55)}
.milestone-item.is-done .milestone-check{opacity:1;transform:scale(1)}
.milestone-foot{display:flex;align-items:center;gap:.5rem;margin-top:1rem;color:#a1a1aa;font-size:.75rem}
.milestone-foot i{width:1rem;height:1rem;color:var(--c)}
@media(max-width:600px){.milestone-head{flex-direction:column}.milestone-count{align-self:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="../assets/roadmap-hub-theme.css">
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-30 backdrop-blur bg-slate-900/85 border-b border-slate-700">
 <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
  <a id="back" href="#" class="hidden items-center gap-1 text-sm text-slate-400 hover:text-white mr-1" style="transition:color 160ms"><i data-lucide="arrow-left" class="w-4 h-4"></i><span class="hidden sm:inline">All roadmaps</span></a><span class="logo"><img src="../logos/logo-mark.svg" alt="Roadmap Hub" class="w-5 h-5"></span><h1 class="font-semibold tracking-tight text-base">__SHORT__ <span class="hidden sm:inline text-slate-400 font-normal text-sm">__SUB__</span></h1>
  <div class="ml-auto flex items-center gap-3 w-52 sm:w-72">
   <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden"><div id="bar" class="h-full bg-acc transition-all duration-500" style="width:0"></div></div>
   <span id="pct" class="text-sm text-slate-300 mono">0/32</span>
  </div>
 </div>
</header>
<main class="max-w-4xl mx-auto px-4 py-10">
 <div class="mb-8"><div class="eyebrow mb-3">__EYEBROW__</div><h2 class="text-4xl sm:text-5xl font-semibold text-white mb-4" style="letter-spacing:-.03em;line-height:1.1">__HERO_TITLE__</h2><p class="text-slate-400 text-lg max-w-2xl" style="line-height:1.65">__HERO_TEXT__</p></div>
 <div id="legend" class="flex flex-wrap gap-2 mb-10"></div>
 <div id="road"></div>
 <div id="mile"></div>
 <p class="text-center text-slate-400 mt-12 text-sm">__FOOTNOTE__</p>
</main>
<div id="root" class="fixed inset-0 z-40" style="pointer-events:none">
 <div class="ov absolute inset-0 bg-black/60" onclick="closeD()"></div>
 <aside id="dr" class="drawer absolute right-0 top-0 h-full w-full max-w-2xl bg-slate-800 border-l border-slate-600 shadow-2xl flex flex-col" style="pointer-events:auto">
  <div id="dh" class="p-5 border-b border-slate-600 flex items-start gap-3"></div>
  <div id="db" class="flex-1 overflow-y-auto p-5 space-y-7"></div>
  <div id="df" class="p-4 border-t border-slate-600 flex items-center gap-2"></div>
 </aside>
</div>
<script>
const R=__ROADMAP_JSON__;
const K="rm:"+R.slug+":";
const LB=Object.assign({data:"Sample data",solution:"Solution",run:"Run",result:"Result",scenario:"Scenario",placeholder:"Write your answer here...",practiceNote:""},R.labels||{});
const LV=R.levels.map((l,i)=>({n:"Level "+(i+1)+" · "+l.name,g:l.goal,cls:"",ic:l.icon}));
const TOPICS=R.topics,PR=R.topics.map(t=>t.pr),PROJ=R.levels.map(l=>l.project),MILE=R.milestones;
R.tables=R.tables||{};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW="SELECT|DISTINCT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|BETWEEN|LIKE|ORDER BY|GROUP BY|HAVING|LIMIT|OFFSET|TOP|ASC|DESC|AS|ON|JOIN|INNER|LEFT|RIGHT|FULL|CROSS|OVER|PARTITION BY|WITH|RECURSIVE|CREATE|OR REPLACE|TABLE|TEMP|VIEW|MATERIALIZED|INDEX|UNIQUE|INSERT INTO|VALUES|UPDATE|SET|DELETE|TRUNCATE|DROP|ALTER|ADD|COLUMN|PRIMARY KEY|REFERENCES|CHECK|DEFAULT|BEGIN|COMMIT|ROLLBACK|SAVEPOINT|ROLLBACK TO|EXPLAIN ANALYZE|EXPLAIN|UNION ALL|UNION|INTERSECT|EXCEPT|CASE|WHEN|THEN|ELSE|END|EXISTS|ANY|ALL|FUNCTION|PROCEDURE|RETURNS|LANGUAGE|TRIGGER|AFTER|BEFORE|FOR EACH ROW|EXECUTE|GRANT|REVOKE|ROLE|TO|LOGIN|PASSWORD|CALL|DATABASE|ISOLATION LEVEL|TRANSACTION|SET TRANSACTION|ROWS|PRECEDING|CURRENT ROW|FOR UPDATE|INCLUDE|REFRESH|FETCH FIRST|ROWS ONLY";
const RX=new RegExp("(--.*)|('[^']*')|\\b("+KW+")\\b|\\b(COUNT|SUM|AVG|MIN|MAX|ROW_NUMBER|RANK|DENSE_RANK|NTILE|LAG|LEAD|FIRST_VALUE|ROUND|CEIL|COALESCE|NULLIF|UPPER|LOWER|TRIM|LENGTH|CONCAT|LOWER)\\b(?=\\s*\\()|\\b(INT|BIGINT|DECIMAL|NUMERIC|VARCHAR|CHAR|TEXT|DATE|TIMESTAMP|BOOLEAN)\\b","gi");
const hlSql=s=>esc(s).replace(RX,(m,c,st,k,f,t)=>c?`<span class="cm">${c}</span>`:st?`<span class="st">${st}</span>`:k?`<span class="kw">${k}</span>`:`<span class="nm">${m}</span>`);
const GEN={python:"def|class|return|import|from|as|if|elif|else|for|while|in|not|and|or|is|None|True|False|async|await|with|try|except|finally|raise|pass|lambda|yield|self|print",js:"const|let|var|function|return|import|from|export|default|if|else|for|while|await|async|new|class|try|catch|throw|true|false|null|undefined|typeof",bash:"curl|pip|npm|npx|git|docker|cd|echo|export|sudo|uvicorn|python|python3|mkdir|source|cat|ls|kubectl",json:"true|false|null",yaml:"true|false|null",http:"GET|POST|PUT|PATCH|DELETE|HTTP|Authorization|Bearer|Content-Type"};
const CM={python:"#.*",bash:"#.*",yaml:"#.*",js:"\\/\\/.*",json:"(?!x)x",http:"(?!x)x"};
const RXG={};
function hl(s,lang){lang=lang||R.lang||"sql";if(lang==="sql")return hlSql(s);if(!GEN[lang])return esc(s);
 const rx=RXG[lang]||(RXG[lang]=new RegExp("("+CM[lang]+")|(\"[^\"\\n]*\"|'[^'\\n]*'|`[^`\\n]*`)|\\b("+GEN[lang]+")\\b|\\b(\\d+(?:\\.\\d+)?)\\b|(@\\w+(?:\\.\\w+)*)","g"));
 return esc(s).replace(rx,(m,c,st,k,n,d)=>c?`<span class="cm">${c}</span>`:st?`<span class="st">${st}</span>`:k?`<span class="kw">${k}</span>`:`<span class="nm">${m}</span>`)}
const md=t=>{const w=t.c.map((c,i)=>Math.max(String(c).length,...t.r.map(r=>String(r[i]===null?"NULL":r[i]).length)));const row=r=>"| "+r.map((v,i)=>String(v===null?"NULL":v).padEnd(w[i])).join(" | ")+" |";return row(t.c)+"\n| "+w.map(n=>"-".repeat(n)).join(" | ")+" |\n"+t.r.map(row).join("\n")};
const resTable=o=>o.text!=null?`<pre class="code mono">${esc(o.text)}</pre>`:`<div class="overflow-x-auto rounded-xl border border-slate-600"><table class="res mono"><thead><tr>${o.c.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${o.r.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<span class="null">NULL</span>':esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

let done=new Set(),ms=new Set(),pj=new Set(),cur=-1;
try{done=new Set(JSON.parse(localStorage.getItem(K+"t")||"[]"));ms=new Set(JSON.parse(localStorage.getItem(K+"m")||"[]"));pj=new Set(JSON.parse(localStorage.getItem(K+"p")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(K+"t",JSON.stringify([...done]));localStorage.setItem(K+"m",JSON.stringify([...ms]));localStorage.setItem(K+"p",JSON.stringify([...pj]))}catch(e){}};

function renderRoad(){
 let h="",n=0;
 LV.forEach((L,li)=>{
  const items=TOPICS.map((x,i)=>[x,i]).filter(([x])=>x.l===li),dn=items.filter(([,i])=>done.has(i)).length;
  h+=`<section class="${L.cls} mb-12"><div class="flex flex-wrap items-center gap-3 mb-1"><span class="badge w-10 h-10 rounded-lg flex items-center justify-center"><i data-lucide="${L.ic}" class="w-5 h-5"></i></span><div class="flex-1"><div class="eyebrow mb-1">${L.n.split(" · ")[0]}</div><h2 class="text-2xl font-semibold tracking-tight text-white" style="line-height:1.2">${L.n.split(" · ")[1]}</h2></div><span class="ml-auto mono text-sm text-slate-300">${dn}/${items.length}${pj.has(li)?" · project ✓":""}</span></div><p class="text-slate-400 text-sm mb-6 pl-[3.25rem]"><b class="text-slate-300 font-medium">Goal:</b> ${L.g}</p><div class="relative pl-14"><div class="line absolute left-[22px] top-0 bottom-0 w-0.5"></div>`;
  for(const [x,i] of items){n++;
   h+=`<div class="row relative mb-4 ${done.has(i)?"done":""}"><div class="node absolute -left-14 top-3 w-11 h-11 rounded-full flex items-center justify-center z-10">${done.has(i)?'<i data-lucide="check" class="w-5 h-5"></i>':`<span class="mono font-bold text-sm">${n}</span>`}</div><button class="card rounded-xl p-4 flex items-center gap-4" onclick="openD(${i})"><span class="badge w-10 h-10 rounded-lg flex items-center justify-center shrink-0"><i data-lucide="${x.i}" class="w-5 h-5"></i></span><span class="flex-1 min-w-0"><span class="block font-semibold text-slate-100">${x.t}</span><span class="block text-sm text-slate-400 truncate">${x.c.slice(0,4).join(" · ")}</span></span><i data-lucide="chevron-right" class="accent w-5 h-5"></i></button></div>`;}
  const P=PROJ[li];
  h+=`<div class="row relative mb-2 ${pj.has(li)?"done":""}"><div class="node absolute -left-14 top-3 w-11 h-11 rounded-full flex items-center justify-center z-10"><i data-lucide="${pj.has(li)?"check":"flag"}" class="w-5 h-5"></i></div><button class="card rounded-xl p-4 flex items-center gap-4" style="border-style:dashed;border-color:var(--c)" onclick="openP(${li})"><span class="badge w-10 h-10 rounded-lg flex items-center justify-center shrink-0"><i data-lucide="${P.ic}" class="w-5 h-5"></i></span><span class="flex-1 min-w-0"><span class="block eyebrow">Level project</span><span class="block font-semibold text-slate-100">${P.t}</span><span class="block text-sm text-slate-400 truncate">${P.brief}</span></span><i data-lucide="chevron-right" class="accent w-5 h-5"></i></button></div>`;
  h+=`</div></section>`;
 });
 document.getElementById("road").innerHTML=h;
 document.getElementById("legend").innerHTML=[["list-checks",TOPICS.length+" topics"],["target",TOPICS.length+" challenges"],["flag",PROJ.length+" projects"]].map(([i,t])=>`<span class="chip flex items-center gap-1.5"><i data-lucide="${i}" class="w-3.5 h-3.5 accent"></i>${t}</span>`).join("");
 const milestonePercent=MILE.length?Math.round(ms.size/MILE.length*100):0;
 const roadmapName=R.short.replace(/ Roadmap$/,"");
 document.getElementById("mile").innerHTML=`<section class="milestone-card"><div class="milestone-head"><div class="milestone-title"><span class="milestone-icon"><i data-lucide="trophy" class="w-6 h-6"></i></span><div><div class="eyebrow">Career-ready checkpoint</div><h2>Final Milestone</h2><p>Bring your ${roadmapName} skills together. Check off each capability as you build it.</p></div></div><span class="milestone-count">${ms.size} / ${MILE.length} complete</span></div><div class="milestone-progress" role="progressbar" aria-label="Final milestone progress" aria-valuemin="0" aria-valuemax="${MILE.length}" aria-valuenow="${ms.size}"><span style="width:${milestonePercent}%"></span></div><div class="milestone-list">${MILE.map((m,i)=>`<label class="milestone-item ${ms.has(i)?"is-done":""}"><input type="checkbox" ${ms.has(i)?"checked":""} onchange="tm(${i})"><span class="milestone-number">${String(i+1).padStart(2,"0")}</span><span class="milestone-text">${m}</span><i data-lucide="check" class="milestone-check"></i></label>`).join("")}</div><div class="milestone-foot"><i data-lucide="${milestonePercent===100?"badge-check":"list-checks"}"></i><span>${milestonePercent===100?"Every milestone checked off. Keep building and sharing your work.":"Your progress is saved automatically on this device."}</span></div></section>`;
 document.getElementById("pct").textContent=done.size+"/"+TOPICS.length;
 document.getElementById("bar").style.width=(done.size/TOPICS.length*100)+"%";
 lucide.createIcons();
}
const tm=i=>{ms.has(i)?ms.delete(i):ms.add(i);save();renderRoad()};
const sec=(ic,t,b)=>`<section class="fade"><h3 class="sh"><i data-lucide="${ic}"></i>${t}</h3>${b}</section>`;
const frag=h=>`<ul class="frag">${h.split(/(?<=[.!?])\s+(?=[A-Z<"\\(])/).map(x=>`<li>${x}</li>`).join("")}</ul>`;
function openD(i){
 cur=i;const x=TOPICS[i],L=LV[x.l],dr=document.getElementById("dr");
 dr.className=dr.className.replace(/\bl\d\b/g,"").trim()+" "+L.cls;
 document.getElementById("dh").innerHTML=`<span class="badge w-12 h-12 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="${x.i}" class="w-6 h-6"></i></span><div class="flex-1"><div class="eyebrow">${L.n.split(" · ")[0]} · Topic ${i+1} of ${TOPICS.length}</div><h2 class="text-2xl font-bold text-white">${x.t}</h2></div><button onclick="closeD()" aria-label="Close" class="p-2 rounded-lg hover:bg-slate-700 text-slate-300"><i data-lucide="x"></i></button>`;
 const tabs=(x.tb.length?`<div class="lbl">${LB.data}</div>`:"")+x.tb.map(k=>{const tb=typeof k==="string"?R.tables[k]:k;return `<div class="mb-3"><div class="text-xs text-slate-400 mb-1 mono">Table: <span class="accent">${tb.n}</span></div><pre class="code mono">${esc(md(tb))}</pre></div>`}).join("");
 document.getElementById("db").innerHTML=
  sec("lightbulb","Concept Primer",frag(x.p))+
  sec("list-checks","What you'll cover",`<div class="flex flex-wrap gap-2">${x.c.map(c=>`<span class="chip">${c}</span>`).join("")}</div>`)+
  sec("code-2","Syntax Blueprint",`<pre class="code mono">${hl(x.s,x.lang)}</pre>`)+
  sec("briefcase","Interactive Example Case",`<div class="scn mb-4"><div class="eyebrow mb-1">${LB.scenario}</div><p class="text-slate-100">${x.sc}</p></div>${tabs}<div class="lbl mt-4">${LB.solution}</div><pre class="code mono">${hl(x.q,x.lang)}</pre><button id="run" class="mt-3 px-4 py-2 rounded-lg font-semibold text-slate-900 flex items-center gap-2 hover:brightness-110" style="background:var(--c)"><i data-lucide="play" class="w-4 h-4"></i>${LB.run}</button><div id="out" class="mt-4"></div>`)+practice(i);
 document.getElementById("run").onclick=()=>{document.getElementById("out").innerHTML=`<div class="lbl fade">${LB.result}${x.o.r?" · "+x.o.r.length+" row"+(x.o.r.length>1?"s":""):""}</div><div class="fade">${resTable(x.o)}</div>`};
 const d=done.has(i);
 document.getElementById("df").innerHTML=`<button onclick="nav(-1)" ${i==0?"disabled":""} class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 disabled:opacity-30" aria-label="Previous"><i data-lucide="arrow-left"></i></button><button onclick="toggle()" class="flex-1 py-2 rounded-lg font-semibold flex items-center justify-center gap-2 ${d?"bg-slate-700 text-slate-100":"text-slate-900"}" ${d?"":'style="background:var(--c)"'}><i data-lucide="${d?"rotate-ccw":"check-circle-2"}" class="w-4 h-4"></i>${d?"Mark as not done":"Mark complete"}</button><button onclick="nav(1)" ${i==TOPICS.length-1?"disabled":""} class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 disabled:opacity-30" aria-label="Next"><i data-lucide="arrow-right"></i></button>`;
 document.getElementById("db").scrollTop=0;
 const r=document.getElementById("root");r.style.pointerEvents="auto";r.classList.add("open");lucide.createIcons();
}
function closeD(){const r=document.getElementById("root");r.classList.remove("open");setTimeout(()=>{if(!r.classList.contains("open"))r.style.pointerEvents="none"},350)}
const nav=d=>{const n=cur+d;if(n>=0&&n<TOPICS.length)openD(n)};
function toggle(){done.has(cur)?done.delete(cur):done.add(cur);save();renderRoad();openD(cur)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD();if(document.getElementById("root").classList.contains("open")){if(e.key==="ArrowRight")nav(1);if(e.key==="ArrowLeft")nav(-1)}});
function practice(i){const p=PR[i];return sec("target","Practice Challenge",`<div class="rounded-xl p-4 mb-3 border border-slate-700 bg-slate-900/60"><div class="eyebrow mb-1">Your turn</div><p class="text-slate-100">${p[0]}</p></div><textarea class="code mono w-full" rows="5" placeholder="${LB.placeholder}" spellcheck="false" style="white-space:pre-wrap;resize:vertical"></textarea><div class="flex flex-wrap gap-2 mt-3"><button onclick="document.getElementById('hint').classList.toggle('hidden')" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-100 text-sm font-semibold flex items-center gap-2"><i data-lucide="lightbulb" class="w-4 h-4"></i>Show hint</button><button onclick="document.getElementById('sol').classList.toggle('hidden')" class="px-4 py-2 rounded-lg text-slate-900 text-sm font-semibold flex items-center gap-2 hover:brightness-110" style="background:var(--c)"><i data-lucide="eye" class="w-4 h-4"></i>Show solution</button></div><div id="hint" class="hidden mt-3 scn text-sm text-slate-100">Hint: ${p[1]}</div><pre id="sol" class="code mono hidden mt-3">${hl(p[2],TOPICS[i].lang)}</pre><p class="text-xs text-slate-400 mt-2">${LB.practiceNote}</p>`)}
function openP(li){
 cur=-1;const P=PROJ[li],L=LV[li],dr=document.getElementById("dr");
 dr.className=dr.className.replace(/\bl\d\b/g,"").trim()+" "+L.cls;
 document.getElementById("dh").innerHTML=`<span class="badge w-12 h-12 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="${P.ic}" class="w-6 h-6"></i></span><div class="flex-1"><div class="eyebrow">${L.n.split(" · ")[0]} · Mini-project</div><h2 class="text-2xl font-bold text-white">${P.t}</h2></div><button onclick="closeD()" aria-label="Close" class="p-2 rounded-lg hover:bg-slate-700 text-slate-300"><i data-lucide="x"></i></button>`;
 document.getElementById("db").innerHTML=sec("flag","Project Brief",`<p class="text-slate-200 leading-relaxed">${P.brief}</p>`)+sec("list-ordered","What You'll Build",`<ol class="space-y-2">${P.steps.map((x,k)=>`<li class="flex gap-3 items-start"><span class="badge w-6 h-6 rounded-full flex items-center justify-center text-xs mono shrink-0">${k+1}</span><span class="text-slate-200">${x}</span></li>`).join("")}</ol>`)+sec("wrench","Skills Used",`<span class="chip">${P.skills}</span>`)+sec("package-check","Deliverable",`<div class="scn"><p class="text-slate-100">${P.out}</p></div><p class="text-xs text-slate-400 mt-3">Tip: publish the project on GitHub. It becomes part of your portfolio.</p>`);
 const d=pj.has(li);
 document.getElementById("df").innerHTML=`<button onclick="tp(${li})" class="flex-1 py-2 rounded-lg font-semibold flex items-center justify-center gap-2 ${d?"bg-slate-700 text-slate-100":"text-slate-900"}" ${d?"":'style="background:var(--c)"'}><i data-lucide="${d?"rotate-ccw":"check-circle-2"}" class="w-4 h-4"></i>${d?"Mark project as not done":"Mark project complete"}</button>`;
 document.getElementById("db").scrollTop=0;
 const r=document.getElementById("root");r.style.pointerEvents="auto";r.classList.add("open");lucide.createIcons();
}
function tp(li){pj.has(li)?pj.delete(li):pj.add(li);save();renderRoad();openP(li)}
if(R.hub){const b=document.getElementById("back");b.href=R.hub;b.classList.remove("hidden");b.classList.add("flex")}
renderRoad();
</script>
</body>
</html>
