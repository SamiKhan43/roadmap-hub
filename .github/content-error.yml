name: Content error
description: Report a wrong output, broken example, typo or confusing explanation
title: "[Fix] "
labels: ["content fix"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic title
      description: Exactly as shown in the lesson drawer
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - Wrong output or result
        - Code does not run
        - Practice solution is wrong
        - Confusing explanation
        - Typo
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did you expect and what did you see? Include the code and error message if any.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional, but welcome.
