<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="logos/logo-mark.svg">
<title>Learning Roadmaps</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{slate:{100:"#f4f4f5",200:"#e4e4e7",300:"#d4d4d8",400:"#a1a1aa",500:"#8a8a93",600:"#303036",700:"#232328",800:"#141417",900:"#0c0c0e",950:"#09090b"}}}}}</script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{--line:#27272c;--line-strong:#3f3f46;--ease:cubic-bezier(.2,.8,.2,1)}
*{-webkit-font-smoothing:antialiased}
body{background:#09090b radial-gradient(60% 380px at 50% -80px,rgba(255,255,255,.07),transparent) no-repeat;color:#e4e4e7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;letter-spacing:0;font-variant-numeric:tabular-nums}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.5rem 1.125rem;border-radius:.625rem;font-size:.9375rem;font-weight:600;line-height:1.2;border:1px solid var(--line-strong);background:transparent;color:#e4e4e7;transition:border-color 160ms var(--ease),background-color 160ms var(--ease),transform 160ms var(--ease)}
.btn:hover{border-color:#71717a;background:rgba(255,255,255,.05)}
.btn:active{transform:scale(.97)}
.btn-primary{background:#fafafa;border-color:#fafafa;color:#09090b}
.btn-primary:hover{background:#e4e4e7;border-color:#e4e4e7}

/* Filter chips: status group, divider, topic group */
#filters{scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
.chip{flex:none;background:#141417;border:1px solid var(--line-strong);color:#d4d4d8;font-size:.875rem;min-height:2.5rem;padding:.25rem .875rem;border-radius:999px;line-height:1.4;display:inline-flex;align-items:center;justify-content:center;gap:.375rem;cursor:pointer;transition:border-color 160ms var(--ease),background-color 160ms var(--ease),transform 160ms var(--ease)}
.chip:hover{border-color:#71717a;background:#1b1b1f}
.chip:active{transform:scale(.96)}
.chip.on{background:#fafafa;color:#09090b;border-color:#fafafa;font-weight:600}
.sep{flex:none;align-self:center;width:1px;height:1.25rem;background:var(--line-strong);margin:0 .25rem}

/* Cards */
.card{--rgb:52,211,153;position:relative;display:flex;flex-direction:column;gap:1rem;padding:1.5rem;border-radius:1rem;background:linear-gradient(180deg,rgba(var(--rgb),.06),rgba(19,19,22,.96)),linear-gradient(180deg,#131316,#0f0f12);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.4);transition:border-color 160ms var(--ease),background 160ms var(--ease),box-shadow 160ms var(--ease),transform 160ms var(--ease);cursor:pointer;text-align:left;width:100%}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,rgb(var(--rgb)),transparent);opacity:0;transition:opacity 200ms var(--ease)}
a.card:hover{transform:translateY(-2px);border-color:rgba(var(--rgb),.7);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 0 0 1px rgba(var(--rgb),.18),0 18px 40px -20px rgba(var(--rgb),.7)}
a.card:hover:before{opacity:1}
a.card:active{transform:translateY(0) scale(.995)}
a.card:hover .go{transform:translateX(3px)}
a.card:hover .cta{background:rgb(var(--rgb));border-color:rgb(var(--rgb));color:#09090b;box-shadow:0 12px 22px -14px rgba(var(--rgb),.8)}
a.card:hover .ico{background:rgba(var(--rgb),.12);border-color:rgba(var(--rgb),.45);color:rgb(var(--rgb))}
a.card:focus-visible{outline-offset:3px}
.go{transition:transform 160ms var(--ease)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;min-height:2.5rem;padding:.375rem .875rem;border-radius:.625rem;border:1px solid var(--line-strong);font-size:.875rem;font-weight:600;line-height:1.2;background:transparent;color:#e4e4e7;transition:background-color 160ms var(--ease),border-color 160ms var(--ease),transform 160ms var(--ease),color 160ms var(--ease),box-shadow 160ms var(--ease)}
.ico{flex:none;width:2.75rem;height:2.75rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;background:rgba(var(--rgb),.12);border:1px solid rgba(var(--rgb),.35);color:rgb(var(--rgb));transition:background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease)}
.pill{flex:none;font-size:.75rem;font-weight:600;padding:.125rem .625rem;border-radius:999px;border:1px solid;line-height:1.5}
.meta{font-size:.8125rem;color:#a1a1aa;display:inline-flex;align-items:center;gap:.375rem}
.bar{height:6px;border-radius:6px;background:#27272c;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:rgb(var(--rgb));transition:width 400ms var(--ease)}

/* Coming soon: full contrast, signalled by dashed border instead of opacity */
.card.soon{background:transparent;border-style:dashed;border-color:var(--line-strong);box-shadow:none}
.card.soon .ico{background:transparent;border-color:var(--line-strong);color:#d4d4d8}

/* Resume row */
.resume{--rgb:52,211,153;display:flex;align-items:center;gap:1rem;padding:1rem 1.125rem;border-radius:.875rem;border:1px solid var(--line-strong);background:#111114;transition:border-color 160ms var(--ease),background-color 160ms var(--ease),transform 160ms var(--ease),box-shadow 160ms var(--ease)}
.resume:hover{border-color:rgba(var(--rgb),.6);background:linear-gradient(180deg,rgba(var(--rgb),.08),#151519);box-shadow:0 0 0 1px rgba(var(--rgb),.12)}
.resume:active{transform:scale(.99)}
.resume:hover .go{transform:translateX(3px)}
.resume:hover .ico{background:rgba(var(--rgb),.12);border-color:rgba(var(--rgb),.35)}

input{transition:border-color 160ms var(--ease),box-shadow 160ms var(--ease)}
input:hover{border-color:#71717a}
:focus-visible{outline:2px solid #fafafa;outline-offset:2px;border-radius:.5rem}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
.nav-link{display:block;padding:.5rem .75rem;border-radius:.5rem;color:#b4b4bd;font-size:.875rem;transition:background .15s,color .15s}
.nav-link:hover,.nav-link:focus-visible{background:rgba(255,255,255,.08);color:#fff}
.nav-link[aria-current="true"]{background:rgba(255,255,255,.1);color:#fff}
@media (prefers-reduced-motion:reduce){
 *,*:before{transition:none!important;animation:none!important}
 html{scroll-behavior:auto}
 a.card:hover,a.card:active,.btn:active,.chip:active,.resume:active{transform:none}
 a.card:hover .go,.resume:hover .go{transform:none}
}
</style>
</head>
<body class="min-h-screen">
