<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing you in | Roadmap Hub</title>
  <link rel="icon" type="image/svg+xml" href="../logos/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/supabase-client.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d0f0e;
      --surface: #131614;
      --border: #29312b;
      --text: #f0f2ec;
      --muted: #a0aaa0;
      --accent: #c6f36a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .card {
      width: min(520px, calc(100% - 32px));
      padding: 28px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 18px;
      border: 2px solid rgba(198, 243, 106, 0.22);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.4rem); }
    p { margin: 0; color: var(--muted); line-height: 1.7; }
    .error { color: #fda4af; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <h1 id="status-title">Signing you in...</h1>
    <p id="status-message">Completing your secure sign-in and redirecting you to your dashboard.</p>
  </main>
  <script>
    (async () => {
      const base = (window.location.pathname || "/").includes("/roadmap-hub/")
        ? "/roadmap-hub"
        : "";
      const loginUrl = `${base}/auth/index.html` || "/auth/index.html";
      const dashboardUrl = `${base}/dashboard.html` || "/dashboard.html";
      const title = document.getElementById("status-title");
      const message = document.getElementById("status-message");
      const spinner = document.getElementById("spinner");

      const showError = (error) => {
        console.error("OAuth callback error", error);
        spinner.hidden = true;
        title.textContent = "We couldn't sign you in";
        message.className = "error";
        message.textContent = "Please try signing in again.";
        window.setTimeout(() => window.location.replace(loginUrl), 3000);
      };

      const client = window.ROADMAP_HUB_SUPABASE
        ? window.ROADMAP_HUB_SUPABASE.getClient()
        : null;

      if (!client) {
        showError(new Error("Supabase is not configured."));
        return;
      }

      try {
        const sessionResult = await client.auth.getSession();
        if (sessionResult.error) throw sessionResult.error;
        if (!sessionResult.data?.session) throw new Error("No authentication session was created.");

        const userResult = await client.auth.getUser();
        if (userResult.error || !userResult.data?.user) {
          throw userResult.error || new Error("The authentication session could not be verified.");
        }

        title.textContent = "Welcome back";
        message.textContent = "Opening your dashboard...";
        spinner.hidden = true;
        window.location.replace(dashboardUrl);
      } catch (error) {
        showError(error);
      }
    })();
  </script>
</body>
</html>
