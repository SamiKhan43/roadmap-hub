<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing you in…</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/supabase-client.js"></script>
  <style>
    :root { --page:#0d0f0e; --surface:#131614; --border:#29312b; --text:#f0f2ec; --muted:#a0aaa0; --accent:#c6f36a; --accent-ink:#17200b; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background: var(--page); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .card { width:min(520px, calc(100% - 32px)); background: linear-gradient(180deg, rgba(19,22,20,.96), rgba(13,15,14,.98)); border:1px solid var(--border); border-radius:18px; padding:28px; text-align:center; }
    .title { margin:0 0 8px; font-size: clamp(1.8rem, 4vw, 2.4rem); }
    p { color: var(--muted); line-height: 1.7; }
    .spinner { width: 34px; height: 34px; border: 2px solid rgba(198,243,106,.22); border-top-color: var(--accent); border-radius:50%; margin:18px auto 12px; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1 class="title">Signing you in…</h1>
    <p>Completing your secure sign-in and redirecting you to your dashboard.</p>
  </main>

  <script>
    (async () => {
      const client = window.ROADMAP_HUB_SUPABASE && window.ROADMAP_HUB_SUPABASE.getClient ? window.ROADMAP_HUB_SUPABASE.getClient() : null;
      const base = (window.location.pathname || "/").includes("/roadmap-hub/") ? "/roadmap-hub" : "";

      if (!client) {
        window.location.href = `${base}/auth/index.html` || "/auth/index.html";
        return;
      }

      try {
        const sessionResult = await client.auth.getSession();
        if (sessionResult.error) {
          throw sessionResult.error;
        }
        if (!sessionResult.data?.session) {
          throw new Error("No authentication session was created.");
        }
        const userResult = await client.auth.getUser();
        if (userResult.error || !userResult.data?.user) {
          throw userResult.error || new Error("The authentication session could not be verified.");
        }
        if (userResult.data.user) {
          window.location.href = `${base}/dashboard.html` || "/dashboard.html";
          return;
        }
        window.location.href = `${base}/auth/index.html` || "/auth/index.html";
      } catch (error) {
        console.error("OAuth callback error", error);
        window.location.href = `${base}/auth/index.html` || "/auth/index.html";
      }
    })();
  </script>
</body>
</html>
